        in: query
        required: true
        schema:
          type: string
        description: Unique Merchant ID (MID) to identify your business.
      - name: vertical
        in: query
        required: true
        schema:
          type: string
        description: 'Business type. Options: ecommerce, gaming, financialServices.'
      - name: product_type
        in: query
        required: true
        schema:
          type: string
        description: 'Type of product: payment, payout, ais, or play.'
      - name: locale
        in: query
        required: true
        schema:
          type: string
        description: 'Language code(ISO 639-1) + country code(ISO 3166-1 alpha-2). Example: en_BE.'
