components:
  schemas:
    PostApiApiidRequest:
      type: object
      properties:
        report_types:
          type: array
        country_id:
          type: string
        brand_name:
          type: string
        merchant_reference:
          type: string
        locale:
          type: string
        redirect_uri:
          type: string
        deeplink_redirect:
          type: string
        callbacks:
          type: array
          description: Array of callback objects
        callbacks[].url:
          type: string
          description: Callback URL
        callbacks[].report_state:
          type: string
          description: One of SESSION_ABORTED, SESSION_FAILED, SESSION_COMPLETED, REPORT_GENERATED
    PostApiApiidResponse:
      type: object
      properties:
        access_token:
          type: string
        expires:
          type: number
        refresh_token:
          type: string
    PostBankAccountCreateResponse:
      type: object
      properties:
        id:
          type: string
    PostTransactionCreateWithdrawalRequest:
      type: object
      properties:
        amount:
          type: string
        bank_account_id:
          type: string
        merchant_reference:
          type: string
        statement_reference:
          type: string
        callbacks:
          type: array
          description: Array of callback objects with url and transaction_state
      required:
      - amount
      - bank_account_id
      - merchant_reference
    PostTransactionCreateWithdrawalResponse:
      type: object
      properties:
        id:
          type: string
          description: The id of the payout transaction
        eta:
          type: integer
          description: Estimated time of arrival
    GetV1AssetsResponse:
      type: object
      properties:
        badge:
          type: string
          description: URL to Brites logotype.
        title:
          type: string
          description: Title of the service.
        tagline:
          type: string
          description: Brief description of the service.
        extended_descriptor_text:
          type: array
          description: Array of strings with detailed information.
        bank_logos:
          type: array
          description: Array of URLs to SVG.
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: Api
- name: Assets
- name: Bank Account
- name: Callback
- name: Session
- name: Transaction
